{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Сообщения</h1>
        <a href="{% url 'mailing:message_create' %}" class="btn btn-warning btn-sm rounded-pill fw-semibold shadow">Создать новое сообщение</a>
    </div>
    <ul class="list-group">
        {% for message in message_list %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            <a href="{% url 'mailing:message_detail' message.id %}" class="text-dark">{{ message.subject|slice:":30" }}...</a>
            <div>
                <a href="{% url 'mailing:message_update' message.id %}" class="btn btn-sm btn-secondary ml-2">Редактировать</a>
                <a href="{% url 'mailing:message_delete' message.id %}" class="btn btn-sm btn-danger ml-2">Удалить</a>
            </div>
        </li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
