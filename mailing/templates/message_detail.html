{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <h1 class="mb-4">Тема сообщения: {{ message_detail.subject }}</h1>
    <p>{{ message_detail.body }}</p>

    <a href="{% url 'mailing:message_update' message_detail.id %}" class="btn btn-secondary">Редактировать</a>
    <a href="{% url 'mailing:message_delete' message_detail.id %}" class="btn btn-danger">Удалить</a>
    <a href="{% url 'mailing:message_list' %}" class="btn btn-primary">Вернуться к списку</a>
</div>
{% endblock %}
