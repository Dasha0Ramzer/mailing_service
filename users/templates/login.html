{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center">
        <h1 class="d-flex justify-content-between align-items-center mb-4">Войти</h1>

    </div>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-warning">Войти</button>
        <a href="/" class="btn btn-secondary">На главную</a>
        <a href="{% url 'users:password_reset' %}" class="text-dark">Забыли пароль</a>


    </form>

</div>

{% endblock %}
